name: Dante research signal matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-signal-matrix.yml'
      - 'research/dante/dante_signal_matrix_research.py'
      - 'research/dante/dante_share_1to1_study.py'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore matrix marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_signal_matrix_cache
          key: marcap-signal-matrix-2023-2026-v1
          restore-keys: |
            marcap-signal-matrix-
      - name: Build current full-market panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2023-01-01"
          --out krx_signal_matrix
          --cache marcap_signal_matrix_cache
          --refresh-end-year
          --freshen-with-naver
          --naver-workers 12
          --max-stale-calendar-days 3
      - name: Run research signal matrix
        run: >-
          python research/dante/dante_signal_matrix_research.py
          --ko krx_signal_matrix/ko_eod.parquet
          --kq krx_signal_matrix/kq_eod.parquet
          --out dante_signal_matrix
          --min-turnover 5000000000
          --max-charts 12
      - name: Upload matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-signal-matrix-${{ github.run_number }}
          retention-days: 30
          path: dante_signal_matrix/
