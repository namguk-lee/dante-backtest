name: Dante pullback entry backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-pullback-entry-backtest.yml'
      - 'research/dante/dante_public_entry_backtest.py'
      - 'research/dante/dante_public_technique_backtest.py'
      - 'research/dante/dante_signal_matrix_research.py'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore pullback history cache
        uses: actions/cache@v4
        with:
          path: marcap_pullback_cache
          key: marcap-pullback-2019-2026-v1
          restore-keys: |
            marcap-pullback-
      - name: Build historical market panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2019-01-01"
          --out krx_pullback
          --cache marcap_pullback_cache
          --refresh-end-year
      - name: Backtest delayed pullback entries
        run: >-
          python research/dante/dante_public_entry_backtest.py
          --ko krx_pullback/ko_eod.parquet
          --kq krx_pullback/kq_eod.parquet
          --out dante_pullback_backtest
          --min-turnover 5000000000
          --cooldown 20
          --entry-window 20
      - name: Upload pullback backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-pullback-entry-backtest-${{ github.run_number }}
          retention-days: 30
          path: dante_pullback_backtest/
