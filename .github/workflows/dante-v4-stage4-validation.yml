name: Dante stage-4 first-breakout success vs failure validation

on:
  push:
    branches:
      - agent/dante-independent-indicators-20261114
    paths:
      - .github/workflows/dante-v4-stage4-validation.yml
      - research/dante/dante_v4_stage4_success_validation.py
      - research/dante/dante_base_v4_daily_backtest.py
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt "scikit-learn>=1.5" "scipy>=1.13"
      - uses: actions/cache@v4
        with:
          path: marcap_weekly_cache
          key: marcap-stage4-2016-2026-v1
          restore-keys: |
            marcap-independent-2016-2026-
            marcap-independent-
            marcap-
      - name: Build Korean cross-sectional history with delisted issues
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start 2016-01-01
          --end 2026-11-13
          --out market
          --cache marcap_weekly_cache
          --refresh-end-year
          --freshen-with-naver
          --naver-workers 20
          --max-stale-calendar-days 2
      - name: Reproduce V4 every-day research signals and simulated 2R outcomes
        run: >-
          python research/dante/dante_base_v4_daily_backtest.py
          --ko market/ko_eod.parquet --kq market/kq_eod.parquet
          --out v4 --min-year 2018
      - name: Recompute target/stop/time-out with censored exclusion
        run: >-
          python research/dante/dante_v4_stage4_success_validation.py
          --signals v4/signals.csv --out success_failure
      - name: Publish audit
        if: success()
        run: |
          echo '### Research only: post-hoc 2R target-hit and failure study' >> "$GITHUB_STEP_SUMMARY"
          echo '6 preselected signal-date features, next-open simulation, no future training features, no actionable model.' >> "$GITHUB_STEP_SUMMARY"
          cat success_failure/fixed_model_time_split_metrics.csv >> "$GITHUB_STEP_SUMMARY"
          cat success_failure/cluster_bootstrap_research.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dante-stage4-signal-failure-validation-${{ github.run_number }}
          retention-days: 30
          path: |
            success_failure/
            v4/summary_splits.csv
            v4/summary_setups.csv
            v4/signal_counts.csv
