name: Dante event-first backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-event-backtest.yml'
      - 'research/dante/dante_event_first_backtest.py'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore historical marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_event_bt_cache
          key: marcap-event-bt-2017-2026-v1
          restore-keys: |
            marcap-event-bt-
      - name: Build survivorship-aware historical panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2017-01-01"
          --end "2026-09-29"
          --out krx_event_bt
          --cache marcap_event_bt_cache
          --refresh-end-year
      - name: Validate event-first hypothesis
        run: >-
          python research/dante/dante_event_first_backtest.py
          --ko krx_event_bt/ko_eod.parquet
          --kq krx_event_bt/kq_eod.parquet
          --out event_backtest_results
          --start "2018-01-01"
          --cost-bps 50
      - name: Upload event backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-event-backtest-${{ github.run_number }}
          retention-days: 30
          path: event_backtest_results/
