name: Dante causal audit checks
on:
  pull_request:
    paths:
      - 'research/dante/**'
      - '.github/workflows/dante-audit-checks.yml'
  push:
    branches: ['agent/dante-case-audit-20260930']
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - run: python -m unittest discover -s research/dante -p 'test_signal_matrix.py' -v
        env:
          PYTHONPATH: research/dante
          MPLCONFIGDIR: /tmp/dante-mpl
