name: Dante share 1to1 study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-share-study.yml'
      - 'research/dante/dante_share_1to1_cases.csv'
      - 'research/dante/dante_share_1to1_study.py'
      - 'research/dante/dante_share_proxy_control_study.py'
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore share-study marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_share_cache
          key: marcap-share-2023-2026-v1
          restore-keys: |
            marcap-share-
      - name: Build historical panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2023-01-01"
          --out krx_share
          --cache marcap_share_cache
          --refresh-end-year
      - name: Run share 1to1 geometry study
        run: >-
          python research/dante/dante_share_1to1_study.py
          --ko krx_share/ko_eod.parquet
          --kq krx_share/kq_eod.parquet
          --cases research/dante/dante_share_1to1_cases.csv
          --out dante_share_study
      - name: Upload geometry early
        uses: actions/upload-artifact@v4
        with:
          name: dante-share-geometry-${{ github.run_number }}
          retention-days: 30
          path: |
            dante_share_study/share_1to1_geometry_v2.csv
            dante_share_study/share_1to1_metric_summary_v2.csv
            dante_share_study/share_1to1_misses_v2.csv
            dante_share_study/charts/

      - name: Run matched-market proxy control study
        run: >-
          python research/dante/dante_share_proxy_control_study.py
          --ko krx_share/ko_eod.parquet
          --kq krx_share/kq_eod.parquet
          --cases research/dante/dante_share_1to1_cases.csv
          --out dante_share_study
      - name: Upload share study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-share-study-${{ github.run_number }}
          retention-days: 30
          path: dante_share_study/
