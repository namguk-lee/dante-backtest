name: Dante blue-dot study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-blue-dot-study.yml'
      - 'research/dante/dante_blue_dot_cases.csv'
      - 'research/dante/dante_blue_dot_study.py'
      - 'research/dante/dante_blue_dot_control_study.py'
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore blue-dot marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_blue_dot_cache
          key: marcap-blue-dot-2023-2026-v1
          restore-keys: |
            marcap-blue-dot-
      - name: Build historical panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2023-01-01"
          --out krx_blue_dot
          --cache marcap_blue_dot_cache
          --refresh-end-year
      - name: Run blue-dot grid study
        run: >-
          python research/dante/dante_blue_dot_study.py
          --ko krx_blue_dot/ko_eod.parquet
          --kq krx_blue_dot/kq_eod.parquet
          --cases research/dante/dante_blue_dot_cases.csv
          --out dante_blue_dot_study
      - name: Run matched-market blue-dot controls
        run: >-
          python research/dante/dante_blue_dot_control_study.py
          --ko krx_blue_dot/ko_eod.parquet
          --kq krx_blue_dot/kq_eod.parquet
          --cases research/dante/dante_blue_dot_cases.csv
          --out dante_blue_dot_study
      - name: Upload blue-dot study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-blue-dot-study-${{ github.run_number }}
          retention-days: 30
          path: dante_blue_dot_study/
