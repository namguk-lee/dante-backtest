name: Research parallel public Dante signal families 2018-2026

on:
  push:
    branches:
      - agent/dante-public-indicator-research-20261113
    paths:
      - .github/workflows/dante-parallel-public-week.yml
      - research/dante/dante_parallel_public_week.py
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - uses: actions/cache@v4
        with:
          path: marcap_weekly_cache
          key: marcap-weekly-review-2023-2026-v1
          restore-keys: |
            marcap-weekly-review-
            marcap-full-
            marcap-
      - name: Build cross-sectional market panel to Nov 13 with delisted episodes
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2016-01-01"
          --end "2026-11-13"
          --out study_market
          --cache marcap_weekly_cache
          --refresh-end-year
          --freshen-with-naver
          --naver-workers 20
          --max-stale-calendar-days 2
      - name: Run independent public-technique family research
        run: >-
          python research/dante/dante_parallel_public_week.py
          --ko study_market/ko_eod.parquet
          --kq study_market/kq_eod.parquet
          --out study_public
      - name: Summarize matched data
        if: success()
        run: |
          echo '### PUBLIC research-only 256 / first 112 / 224 approach / 3-day proxy signals' >> "$GITHUB_STEP_SUMMARY"
          echo 'Distinct from original Dante classic, never an automatic buy. Historical 20-day outcome: next open to day+20 close minus 40bp, no stop.' >> "$GITHUB_STEP_SUMMARY"
          cat study_public/weekly_signal_counts.csv >> "$GITHUB_STEP_SUMMARY"
          cat study_public/historical_20d_summary.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dante-public-parallel-study-${{ github.run_number }}
          retention-days: 30
          path: study_public/
