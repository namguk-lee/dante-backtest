name: Dante public technique backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-public-technique-backtest.yml'
      - 'research/dante/dante_public_technique_backtest.py'
      - 'research/dante/dante_signal_matrix_research.py'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore public-technique history cache
        uses: actions/cache@v4
        with:
          path: marcap_public_backtest_cache
          key: marcap-public-backtest-2019-2026-v1
          restore-keys: |
            marcap-public-backtest-
      - name: Build historical market panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2019-01-01"
          --out krx_public_backtest
          --cache marcap_public_backtest_cache
          --refresh-end-year
      - name: Backtest public technique approximations
        run: >-
          python research/dante/dante_public_technique_backtest.py
          --ko krx_public_backtest/ko_eod.parquet
          --kq krx_public_backtest/kq_eod.parquet
          --out dante_public_backtest
          --min-turnover 5000000000
          --cooldown 20
      - name: Upload public technique backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-public-technique-backtest-${{ github.run_number }}
          retention-days: 30
          path: dante_public_backtest/
