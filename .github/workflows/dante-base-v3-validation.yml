name: Dante strict base V3 validation (research)

on:
  push:
    branches:
      - agent/dante-base-v3-validation-20261113
    paths:
      - .github/workflows/dante-base-v3-validation.yml
      - research/dante/dante_base_v3_experiment.py
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/dante/requirements.txt
      - name: Install dependencies
        run: pip install -r research/dante/requirements.txt
      - name: Restore marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_classic_cache
          key: marcap-base-study-2023-2026-v1
          restore-keys: |
            marcap-classic-
      - name: Collect historical panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2023-01-01"
          --out krx_base_study
          --cache marcap_classic_cache
          --refresh-end-year
      - name: Run V2 vs V3 point-in-time comparison
        run: >-
          python research/dante/dante_base_v3_experiment.py
          --ko krx_base_study/ko_eod.parquet
          --kq krx_base_study/kq_eod.parquet
          --out base_v3_study
          --historical
          --min-turnover 5000000000
      - name: Publish comparison summary
        if: success()
        run: |
          echo '### Strict base V3 vs live V2 (exploratory)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Snapshot-only, 20/60 trading-day adjusted-close returns less 40bp; NOT validated entry/exit trade returns.' >> "$GITHUB_STEP_SUMMARY"
          cat base_v3_study/summary.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-base-v3-comparison-${{ github.run_number }}
          retention-days: 30
          path: base_v3_study/
