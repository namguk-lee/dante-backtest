name: Dante event-first scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-event-first.yml'
      - 'research/dante/dante_event_first_scanner.py'
  workflow_dispatch:
  schedule:
    # 16:20 KST, Monday-Friday (GitHub cron is UTC)
    - cron: '20 7 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore recent marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_event_cache
          key: marcap-event-2024-2026-v1
          restore-keys: |
            marcap-event-
      - name: Build recent full-market panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2024-01-01"
          --end "2026-09-29"
          --out krx_event
          --cache marcap_event_cache
          --refresh-end-year
      - name: Run event-first Dante scan
        run: >-
          python research/dante/dante_event_first_scanner.py
          --ko krx_event/ko_eod.parquet
          --kq krx_event/kq_eod.parquet
          --out dante_event_results
          --event-lookback 60
          --min-event-return 0.05
          --min-event-body 0.035
          --min-event-volume-ratio 2.0
          --min-turnover 5000000000
      - name: Upload event-first results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-event-first-${{ github.run_number }}
          retention-days: 30
          path: dante_event_results/