name: Dante base V3 current-session smoke test

on:
  push:
    branches:
      - agent/dante-base-v3-validation-20261113
    paths:
      - .github/workflows/dante-base-v3-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - uses: actions/cache@v4
        with:
          path: marcap_classic_cache
          key: marcap-base-smoke-2023-2026-v1
          restore-keys: |
            marcap-classic-
      - name: Build point-in-time panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2023-01-01"
          --out krx_base_smoke
          --cache marcap_classic_cache
          --refresh-end-year
      - name: Compare production V2 and strict-base V3 at latest EOD
        run: >-
          python research/dante/dante_base_v3_experiment.py
          --ko krx_base_smoke/ko_eod.parquet
          --kq krx_base_smoke/kq_eod.parquet
          --out base_v3_smoke
          --min-turnover 5000000000
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-base-v3-smoke-${{ github.run_number }}
          retention-days: 30
          path: base_v3_smoke/
