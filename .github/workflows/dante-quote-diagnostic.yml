name: Dante quote diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-quote-diagnostic.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/dante/requirements.txt
      - name: Print recent Naver/FDR rows
        run: |
          python - <<'PY'
          import FinanceDataReader as fdr
          for code in ["003670","004490","452190"]:
              print("\n===", code, "plain ===")
              print(fdr.DataReader(code, "2026-09-23", "2026-09-29").to_string())
              print("\n===", code, "NAVER explicit ===")
              print(fdr.DataReader("NAVER:"+code, "2026-09-23", "2026-09-29").to_string())
          PY
