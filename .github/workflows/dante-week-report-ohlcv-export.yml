name: Export actual OHLCV for weekly Dante PDF AVWAP

on:
  push:
    branches:
      - agent/dante-report-vwap-ohlcv-20261113
    paths:
      - .github/workflows/dante-week-report-ohlcv-export.yml
      - research/dante/export_weekly_report_ohlcv.py
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - uses: actions/cache@v4
        with:
          path: marcap_weekly_cache
          key: marcap-weekly-review-2023-2026-v1
          restore-keys: |
            marcap-classic-
            marcap-event-
            marcap-
      - name: Restore exact historical-source market window
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2023-01-01"
          --end "2026-11-13"
          --out weekly_market
          --cache marcap_weekly_cache
          --refresh-end-year
          --freshen-with-naver
          --naver-workers 20
          --max-stale-calendar-days 2
      - name: Export 12 selected issuers OHLCV and adjustment method
        run: python research/dante/export_weekly_report_ohlcv.py
      - name: Upload dated OHLCV
        uses: actions/upload-artifact@v4
        with:
          name: dante-week-pdf-ohlcv-${{ github.run_number }}
          path: dante_pdf_prices/
          retention-days: 30
