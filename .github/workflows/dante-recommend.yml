name: Dante recommendation scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-recommend.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt
      - name: Restore recent marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_recent_cache
          key: marcap-recommend-2024-2026-v1
          restore-keys: |
            marcap-recommend-
      - name: Build recent point-in-time panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2024-01-01"
          --end "2026-09-29"
          --out krx_recent
          --cache marcap_recent_cache
          --refresh-end-year
      - name: Overlay latest closed KRX sessions
        run: >-
          python research/dante/overlay_latest_pykrx.py
          --ko krx_recent/ko_eod.parquet
          --kq krx_recent/kq_eod.parquet
          --out krx_latest

      - name: Scan recommendation candidates
        run: >-
          python research/dante/dante_recommendation_scanner.py
          --ko krx_latest/ko_eod.parquet
          --kq krx_latest/kq_eod.parquet
          --out dante_recommend
          --top 50
          --min-turnover 5000000000
      - name: Upload recommendations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-recommendations-${{ github.run_number }}
          retention-days: 30
          path: dante_recommend/