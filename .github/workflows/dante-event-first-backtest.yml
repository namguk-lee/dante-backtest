name: Dante event-first historical backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dante-event-first-backtest.yml'
      - 'research/dante/dante_event_first_backtest.py'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/dante/requirements.txt
      - run: pip install -r research/dante/requirements.txt

      - name: Restore full marcap cache
        uses: actions/cache@v4
        with:
          path: marcap_full_cache
          key: marcap-full-2016-2026-v1
          restore-keys: |
            marcap-full-

      - name: Build full-market panel
        run: >-
          python research/dante/collect_marcap_full_market.py
          --start "2016-01-01"
          --end "2026-09-29"
          --out krx_full
          --cache marcap_full_cache
          --refresh-end-year

      - name: Run event-first historical validation
        run: >-
          python research/dante/dante_event_first_backtest.py
          --ko krx_full/ko_eod.parquet
          --kq krx_full/kq_eod.parquet
          --out event_backtest
          --start "2018-01-01"
          --cost-bps 50

      - name: Upload event-first backtest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dante-event-first-backtest-${{ github.run_number }}
          retention-days: 30
          path: event_backtest/
